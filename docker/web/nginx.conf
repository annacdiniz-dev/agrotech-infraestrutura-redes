# =====================================================================
#  AgroTech - Servidor Web da Intranet (nginx)   IP fixo: 192.168.30.12
# =====================================================================
server {
    # Porta 80 dentro do container (publicada no host como 8080).
    listen 80;

    # Responde pelo nome interno e pelo apelido do ERP.
    server_name intranet.agrotech.local erp.agrotech.local 192.168.30.12 localhost;

    # Pasta com os arquivos da intranet (montada como volume, somente leitura).
    root  /usr/share/nginx/html;
    index index.html;

    # Cabeçalho que identifica qual servidor respondeu (útil nos testes com curl -I).
    add_header X-Servidor "agrotech-web (192.168.30.12)" always;

    # Página principal.
    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint simples de verificação de saúde (usado pelos scripts de teste).
    location = /saude {
        default_type text/plain;
        return 200 "OK - intranet AgroTech no ar\n";
    }

    # Logs de acesso e de erro vão para a saída do container (docker logs).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
