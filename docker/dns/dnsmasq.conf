# =====================================================================
#  AgroTech - Servidor DNS (dnsmasq)         IP fixo: 192.168.30.11
#  Zona interna: agrotech.local
# =====================================================================

# Escuta consultas DNS na porta padrão.
port=53

# Não ler o /etc/resolv.conf do container: os servidores externos
# são definidos explicitamente logo abaixo.
no-resolv

# Encaminhadores (forwarders): tudo que não for agrotech.local vai
# para o Google DNS e para o Cloudflare DNS.
server=8.8.8.8
server=1.1.1.1

# A zona agrotech.local é respondida SOMENTE localmente: nomes que não
# existem retornam NXDOMAIN em vez de vazar a consulta para a Internet.
local=/agrotech.local/
domain=agrotech.local

# Boas práticas: não encaminha nomes sem ponto nem consultas reversas
# de faixas privadas (192.168.x.x) para a Internet.
domain-needed
bogus-priv

# Ignora o /etc/hosts interno do container (gerado pelo Docker):
# só os registros da AgroTech devem ser publicados.
no-hosts

# Registros A (nome -> IP) ficam num arquivo de hosts separado,
# mais fácil de ler e manter. O PTR (reverso) é gerado automaticamente.
addn-hosts=/etc/agrotech.hosts

# Registro CNAME (apelido): erp.agrotech.local aponta para a intranet.
cname=erp.agrotech.local,intranet.agrotech.local

# Este container faz SÓ DNS: garante que nunca vai responder DHCP,
# evitando conflito com o servidor DHCP (192.168.30.10).
no-dhcp-interface=eth0

# Registra todas as consultas recebidas na saída padrão
# ("docker compose logs dns").
log-queries
log-facility=-
