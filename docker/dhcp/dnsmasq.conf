# =====================================================================
#  AgroTech - Servidor DHCP (dnsmasq)        IP fixo: 192.168.30.10
#  Rede: agrotech-lan (simula a VLAN 30 - TI / Servidores da matriz)
# =====================================================================

# port=0 desliga a parte de DNS do dnsmasq. Este container faz SÓ DHCP;
# o DNS fica em outro container (192.168.30.11), separando as funções.
port=0

# Atende pedidos DHCP somente na interface ligada à rede agrotech-lan.
interface=eth0

# Pool de endereços: .100 a .200, máscara /24, tempo de concessão de 12 horas.
# Os endereços .1 a .99 ficam reservados para gateway, servidores e IPs fixos.
dhcp-range=192.168.30.100,192.168.30.200,255.255.255.0,12h

# Opção 3 (router): gateway padrão entregue aos clientes.
dhcp-option=option:router,192.168.30.1

# Opção 6 (dns-server): os clientes usarão o DNS interno da AgroTech.
dhcp-option=option:dns-server,192.168.30.11

# Opção 15 (domain-name): sufixo de domínio interno.
dhcp-option=option:domain-name,agrotech.local
domain=agrotech.local

# Servidor autoritativo: responde rápido a clientes que já tinham lease
# (único servidor DHCP do segmento).
dhcp-authoritative

# Arquivo onde as concessões (leases) são registradas.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Registra cada etapa do processo DORA (DISCOVER, OFFER, REQUEST, ACK)
# com detalhes das opções; "-" envia o log para a saída padrão,
# visível com "docker compose logs dhcp".
log-dhcp
log-facility=-

# Envia OFFER e ACK em broadcast (255.255.255.255). Sem isso, o dnsmasq
# responde em unicast para um cliente que ainda não tem IP; na bridge do
# Docker essa primeira resposta se perdia e o cliente precisava repetir o
# DISCOVER. Com broadcast, o processo DORA acontece em uma única rodada.
dhcp-broadcast
