# =====================================================================
#  AgroTech - Servidor FTP (vsftpd)          IP fixo: 192.168.30.13
# =====================================================================

# Modo standalone, IPv4, em primeiro plano (exigência do Docker).
listen=YES
listen_ipv6=NO
background=NO

# Sem acesso anônimo: somente usuários locais autenticados.
anonymous_enable=NO
local_enable=YES

# Permite envio de arquivos (upload); arquivos novos com permissão 644.
write_enable=YES
local_umask=022

# Prende cada usuário na própria pasta (não enxerga o resto do sistema).
chroot_local_user=YES
allow_writeable_chroot=YES

# Modo passivo: o servidor abre uma porta de dados entre 21100 e 21110.
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# O sandbox seccomp do vsftpd é incompatível com alguns kernels de container.
seccomp_sandbox=NO

# Mensagem exibida ao conectar.
ftpd_banner=Bem-vindo ao FTP da AgroTech (ftp.agrotech.local)

# Registra as transferências na saída padrão do container.
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/proc/1/fd/1
